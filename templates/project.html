<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="theme-color" content="#fcfcfb">
    <title>{{DOCUMENT_TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23fcfcfb'/%3E%3Cg transform='rotate(9 32 32)'%3E%3Cpath d='M341 204C381 215 417 239 450 263C485 289 521 327 513 374C510 391 491 398 477 387C468 379 445 337 439 330C434 324 407 304 401 300C360 270 319 248 267 249C225 250 137 276 108 305C86 326 61 380 31 388C17 392 7 381 7 368L6 371C36 237 218 168 341 204ZM147 490C149 473 148 455 153 439C153 438 155 440 156 440C156 440 155 435 155 434C155 430 156 425 159 422C176 401 199 426 203 444C209 468 198 510 195 535C192 558 192 617 184 636C178 650 158 651 150 638C141 624 142 604 142 589L140 588C141 555 143 523 147 490ZM327 456C330 433 365 417 373 446C375 454 378 462 379 471C381 490 365 619 360 641C356 658 333 661 325 646C317 630 319 607 319 590L319 592C319 547 320 501 327 456Z' transform='translate(8.457 70.484) scale(0.091 -0.091)' fill='%23292b27'/%3E%3C/g%3E%3C/svg%3E">
    <link rel="preload" href="../../assets/fonts/EF-Regular.otf" as="font" type="font/otf" crossorigin>
    <link rel="preload" href="../../assets/fonts/EF-Bold.otf" as="font" type="font/otf" crossorigin>
    <link rel="preload" href="../../assets/fonts/Icons.otf" as="font" type="font/otf" crossorigin>
    <link rel="stylesheet" href="../../styles.css?v={{STYLE_VERSION}}">
    <script src="../../script.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#project">Skip to project</a>
    <div class="page project-page">
      <header class="site-header">
        <a class="signature" href="../../" aria-label="EF portfolio home">ef.</a>
        <a class="back-link" href="../../#work"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg> All work</a>
      </header>
      <main id="project">
        <header class="project-intro">
          {{EYEBROW}}
          <div class="project-title-row">
            <h1>{{TITLE}}<span class="title-period">.</span></h1>
            {{PROJECT_YEAR}}
          </div>
          {{SUBTITLE}}
          {{PROJECT_META}}
        </header>

{{SECTIONS}}

      </main>
      <footer class="site-footer">
        <div class="social-icons" aria-label="Social profiles">
          <a class="social-icon icon-font" href="https://www.linkedin.com/in/EliForta" target="_blank" rel="noreferrer" aria-label="LinkedIn">A</a>
        </div>
        <span class="footer-credit">Made by <span class="footer-signature">ef.</span></span>
      </footer>
    </div>
    <dialog class="drawing-dialog" aria-labelledby="drawing-title">
      <div class="dialog-header">
        <div><span class="eyebrow">Selected work</span><h2 id="drawing-title">{{TITLE}}</h2></div>
        <button class="close-dialog" type="button" autofocus aria-label="Close image"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
      </div>
      <div class="dialog-art">
        <img class="dialog-image" alt="">
        <video class="dialog-video" muted loop playsinline autoplay preload="metadata" disablepictureinpicture disableremoteplayback hidden></video>
      </div>
      <div class="dialog-footer"><span class="dialog-project-title">{{TITLE}}</span><span class="dialog-note">A closer look.</span></div>
    </dialog>
  </body>
</html>
