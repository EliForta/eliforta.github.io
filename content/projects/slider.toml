[[sections]]
type = "text"
id = "overview"
title = "Overview"
width = "reading"
body = "I designed a magnetic fidget slider with interchangeable sides, then made and sold it on Etsy. The goal was a compact, satisfying object that leveraged the quirks of 3D printing. Magnets are embedded during the print, the surfaces pick up the build plate's texture, and the sides snap into place."

[[sections]]
type = "columns"
id = "outcomes"
columns = 3
spacing = "compact"

  [[sections.items]]
  title = "43 orders"
  text = "Made and fulfilled through Etsy."

  [[sections.items]]
  title = "20 five-star reviews"
  text = "Customer feedback on the finished product."

  [[sections.items]]
  title = "4 magnet suppliers"
  text = "Compared during development for tactile feedback."

[[sections]]
type = "split"
id = "development"
title = "Development"
image_side = "right"
media_layout = "grid"
body = "The original idea was a more elongated shape, but I was not happy with how it felt. I started over, shifting the design to a more compact, three-tier arrangement. During development I experimented with a variety of magnet sizes. When I found a size I liked, I tried 4 different sources to find the one that provided the best tactile feel."

