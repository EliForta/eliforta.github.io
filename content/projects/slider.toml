  point = [0.43, 0.24]

  [[sections.notes]]
  title = "Magnets without glue"
  text = "Magnets are inserted during printing and enclosed as the print continues."
  point = [0.3, 0.44]

  [[sections.notes]]
  title = "Sides that swap"
  text = "Snap-fit connectors hold the side panels and let them be exchanged."
  point = [0.3, 0.74]

[[sections]]
type = "text"
id = "process"
title = "Preventing waste"
width = "reading"
spacing = "compact"
body = "Embedding magnets removes the gluing step, but it also puts reusable components inside a sealed part. I included small weak points so a tool can easily push the magnets out if a print wasn't up to standard."

