[[sections]]
type = "split"
id = "overview"
title = "Overview"
image_side = "right"
media_layout = "single"
body = """
Our team designed an automatic clipboard dispenser to make a volunteer assembly station more accessible to people with disabilities. A button triggers a servo-driven mechanism, controlled by an Arduino, to dispense one clipboard at a time.

As team lead, I helped take the device through three prototypes and incorporated stakeholder feedback. I also coordinated with the team developing the clipboard-grabbing device so the two systems could work with their custom clipboards.
"""

