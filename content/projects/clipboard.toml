[[sections]]
type = "split"
id = "overview"
title = "Overview"
image_side = "right"
media_layout = "single"
body = """
Connect Us operates The Line, a 12-station activity where participants help assemble items for other charities. At Station 1, users originally retrieved a clipboard using a pole and magnet. The task required significant reach and strength, and many participants needed assistance to complete it.

Our team redesigned the station around an automatic clipboard dispenser. A single button press activates an Arduino-controlled servo mechanism that dispenses one clipboard at a time, reducing the physical demands of the original task.

As team lead, I helped guide the design through multiple prototype iterations, incorporated stakeholder feedback, and coordinated compatibility with another team's clipboard design. The final prototype combined automatic dispensing, a movable activation button, sensory feedback, and adaptable printed components to support a wider range of users.
"""

