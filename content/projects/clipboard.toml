[[sections]]
type = "split"
id = "overview"
title = "Overview"
image_side = "right"
media_layout = "single"
body = """
Connect Us runs The Line, a 12-station activity where individuals with severe disabilities help make items for other charities. At Station 1, participants pick up the clipboard they use for the rest of The Line. The original station had them lift the clipboard with a pole and magnet, which took reach and strength. Many participants needed significant help from an assistant, and Connect Us felt the station made for an underwhelming start.
"""

  [[sections.images]]
  src = "assets/images/clipboard/station1.png"
  alt = "Completed clipboard dispenser with a large external push button"
  caption = "The original Station 1: a magnet on a pole."
  fit = "contain"
  surface = "elevated"
  scale="0.7"

[[sections]]
type = "split"
image_side = "left"
body = """
Our team replaced the pole with an automatic clipboard dispenser. One press of a large button runs an Arduino-controlled servo that dispenses a single clipboard down a ramp, with lights and sound along the way.

I led the team, and we coordinated with a parallel team designing a custom clipboard-grabbing system so the two designs would work together. I did the CAD and mechanical design, cut the enclosure on my CNC router, 3D printed the components, programmed the Arduino, wired the electronics, and ran testing.
"""
[[sections.images]]
src = "assets/images/clipboard/clipboard2.jpg"
alt = "Completed clipboard dispenser with a large external push button"
caption = "The final dispenser and movable activation button."
fit = "contain"
surface = "elevated"

[[sections]]
type = "columns"
id = "outcomes"
title = "Validated outcomes"
columns = 3
spacing = "compact"

  [[sections.items]]
  title = "4.3 seconds"
  text = "Average participant operation time during validation testing."

  [[sections.items]]
  title = "≥50% independent"
  text = "Users could independently complete at least half of the station, compared with a previous worst-case level of about 17%."

  [[sections.items]]
  title = "45+ cycles"
  text = "Consecutive clipboard dispensing cycles completed without a jam."


[[sections]]
type = "columns"
id = "accessibility"
title = "Designing for accessibility"
columns = 3
spacing = "compact"

  [[sections.items]]
  title = "Single-button operation"
  text = "One press dispenses one clipboard. Users no longer have to reach, lift, or steer the magnetic pole, which is where seated users needed the most help."

  [[sections.items]]
  title = "Flexible input placement"
  text = "The button sits on a long cable instead of the box, so assistants can put it wherever each participant can reach it."

  [[sections.items]]
  title = "Sensory feedback"
  text = "Connect Us wanted Station 1 to be a more exciting start to The Line, so the dispenser lights up and beads in the ramp wheels rattle as the clipboard rolls down. The lights stay steady and the sound stays soft, because flashing lights and loud noise were ruled out."


