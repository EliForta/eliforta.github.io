  title = "Replaceable printed spacers"
  text = "The spacers are printed parts that can be swapped, so the dispenser can take a different clipboard design without rebuilding the enclosure."
  point = [0.6, 0.2]

  [[sections.notes]]
  title = "Internal wiring channels"
  text = "I routed the wiring through channels in the spacers, so the wires stay hidden and the recessed LEDs are protected."
  point = [0.6, 0.605]

  [[sections.notes]]
  title = "Adaptable outlet"
  text = "The oversized front opening accepts interchangeable printed components, making the dispensing geometry easier to adjust for different clipboards."
