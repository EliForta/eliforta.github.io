  [[sections.items]]
  title = "Single-button operation"
  text = "A single press starts the dispensing cycle, eliminating the need to reach for, lift, or manipulate the original magnetic pole."

  [[sections.items]]
  title = "Flexible input placement"
  text = "The activation button connects through a long cable so it can be positioned where it is easiest for an individual user to reach."

  [[sections.items]]
  title = "Sensory feedback"
  text = "Lighting, movement, sound, and other feedback make the station more interactive without relying on flashing lights or high-pitched audio."


