  title = "Rechargeable power"
  text = "We first assumed the station would be near an outlet. That turned out not to be true, so the final version runs on a rechargeable USB-C battery, which lasted at least three hours in testing."

  [[sections.items]]
  title = "Designed for setup"
  text = "The ramp comes off, the wiring is hidden, and silicone feet keep the station from sliding on the table."


