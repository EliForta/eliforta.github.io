[[sections]]
type = "detail"
title = "Fitting everything inside"
id = "cross-section"
spacing = "compact"
style = "wide"
image = "assets/images/dynamo/dynamo2.png"
fit = "contain"
note_side = "both"

  [[sections.notes]]
  title = "The barrel"
  text = "The clear barrel was achieved with a resin 3D print. Because the components in the barrel would be impossible to fit through either end, the barrel is actually two halves joined at a hidden seam."
  point = [0.43, 0.13]
  side = "top"

  [[sections.notes]]
  title = "Brightness control"
  text = "A potentiometer for brightness control is hidden in pre-existing detail in the design."
  point = [0.73, 0.27]
  side = "top"

  [[sections.notes]]
  title = "Electronics compartment"
  text = "This 'chamber' in the original design was used to house the electronics. It contains a brightness controller, a power distribution PCB, a battery, and a voltage converter. The internal volume of this chamber is only ~2 in³, so it was a tight fit."
  point = [0.67, 0.27]
  side = "bottom"

    [[sections.notes]]
  title = "Hidden bolts"
  text = "Most of the fake bolts actually obscure real bolts and utilize printed threads to attach securely."
  point = [0.558, 0.67]
  side = "bottom"


    [[sections.notes]]
  title = "Handle reinforcement"
  text = "This 'core' is a critical reinforcement. Without it, the layers in the printed handle would be parallel to the force. The core is printed horizontally, and it connects to the rest of the body via two bolts and two metal rods."
  point = [0.89, 0.57]
  side = "bottom"


