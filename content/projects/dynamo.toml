[[sections]]
type = "text"
id = "challenges"
title = "Challenges"
width = "full"
body = """
The hardest part was figuring out how the parts would connect and be assembled. An in-game model only needs to look convincing; that factor is rarely considered in the design. A physical prop needs connections that can be assembled and hold everything in place. Working out those details while keeping the original appearance was one of the parts I enjoyed most.

The barrel is a good example of this. In the in-game model, it appears to be held in place by the blue retaining ring. That connection alone wouldn't be enough for the physical prop, so I needed a way to secure the barrel without changing its appearance.

The internal parts are too large to pass through either end of the barrel, so I split it into two sections with a hidden seam. The images below show the assembly sequence. Click any image for a closer look!
"""

