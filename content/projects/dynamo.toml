[[sections]]
type = "text-image"
id = "overview"
title = "Overview"
image = "assets/images/dynamo/dynamo6.jpg"
image_alt = "Finished Dynamo cosplay prop with blue housing, a brown grip, and exposed colored wires"
body = """
A friend asked me for help with their cosplay of Dynamo from the game Deadlock. A common way to turn an in-game model into a prop is to print it as one piece or glue together smaller sections, then sand, prime, and paint it.

For this project, though, I saw an opportunity for an interesting challenge.


"""

[[sections]]
type = "text"
width = "full"
body = """
I wanted to recreate the model from scratch in CAD and determine how it could be broken down into individual parts and assembled as a real object. Every part was separated by color, and then I figured out how each piece would connect using only bolts and printed connectors, while planning the internal assembly around the electronics and wiring. The end result far exceeded my goals while keeping the exterior design, scale, and proportions identical to the original model.
"""

