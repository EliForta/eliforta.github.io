[[sections]]
type = "text-image"
id = "overview"
title = "Overview"
image = "assets/images/dynamo/dynamo6.jpg"
image_alt = "Finished Dynamo cosplay prop with blue housing, a brown grip, and exposed colored wires"
body = """
A friend asked me for help with their cosplay of Dynamo from the game Deadlock. A common way to turn an in-game model into a prop is to print it as one piece or glue together smaller sections, then sand, prime, and paint it.

I took a different approach for two reasons. The prop's barrel is supposed to look like glass with parts visible inside, which a painted solid print can't reproduce. And painting isn't my strength, so I wanted every part printed in its final color and assembled mechanically.
"""
[[sections]]
type = "text"
width = "full"
body = """
I rebuilt the model from scratch in Onshape and worked out how to split it into parts that could be assembled as a real object. I used hidden fasteners, printed threads, and metal hardware, and planned the interior around the electronics and wiring. The finished prop is practically identical to the in-game model. Design took a few months of on-and-off work, and fabrication and assembly took about two more weeks.
"""

[[sections]]
type = "split"
title = "Recreating the model"
width = "full"
body = """
I extracted the model from the game, imported the mesh into Onshape, and scaled it. The mesh had clean geometry, and many parts were aligned with their own axes, so I could trace them. I created a sketch plane through reference vertices, projected those points into the sketch, drew profiles between them, and then extruded or revolved each profile. Parts that weren't aligned with an axis took more work.
"""
[[sections.images]]
  src = "assets/images/dynamo/trace.png"
  caption = "Tracing a part of the frame from the reference mesh."
  surface = "elevated"


