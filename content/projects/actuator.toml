[[sections]]
type = "split"
id = "compression-seal"
title = "Mount v2 - captured flange"
width = "full"
body = "I changed the molds to add a flange to the end of each actuator. The new mount clamps that flange between a frame and a compression piece. The seal no longer depends on the actuator's flat underside staying attached to a fitting. The result is a self-contained module with a seal that stays assembled when it moves to a different fixture. The section view shows how the flange is captured."

  [[sections.images]]
  src = "assets/images/actuator/actuator2.jpg"
  scale=0.5
  caption = "New actuator with an added flange"

