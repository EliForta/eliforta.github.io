[[sections]]
type = "text"
id = "next-tests"
title = "Current work"
width = "reading"
# Keep this in-progress wording until automation and material tests are complete.
body = """
I identified nonwoven polypropylene and silkscreen fabric as candidate strain-limiting layers. The next step is to compare their behavior with a controlled test procedure.

I am currently developing a Python-controlled setup to coordinate filling, exhaust, and gantry motion. The aim is to reduce variation from manual operation before comparing materials and actuator designs. 
"""
