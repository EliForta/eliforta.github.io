[[sections]]
type = "text"
id = "overview"
title = "Overview"
width = "reading"
body = """
For the Autonomous Disassembly and Sorting of Batteries research project, I am working on half-round fiber-reinforced silicone actuators for an end effector. My work includes fabrication, mold design, mounting, and preparation for controlled testing.

The challenge has been making the hardware consistent enough to compare designs. Each round of prototyping exposed the next problem: difficult molding, leakage under load, then delamination of the strain-limiting layer.
"""

[[sections]]
type = "split"
id = "parametric-molds"
title = "Improving the molds"
image_side = "right"
media_layout = "grid"
body = """
The original molds depended on shared steel stock and external clamps, left both actuator ends open, and were prone to trapping bubbles. Limited hardware also restricted simultaneous casting.

I rebuilt the molds in parametric CAD so actuator length, fiber angle, and wall thickness could be changed directly. The model generates part numbers and calculates the silicone needed for pouring by weight, making each variant easier to identify and prepare.
"""

