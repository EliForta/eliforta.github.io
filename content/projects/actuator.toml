[[sections]]
type = "text"
id = "overview"
title = "Overview"
width = "full"
body = """
The Autonomous Disassembly and Sorting of Batteries project has two parts: a software and conveyor system, and a silicone end effector. I'm the only person working on the silicone end effector. I'm developing half-round fiber-reinforced silicone actuators for it. I set my own development priorities and report progress to the supervising professors.

So far I've cast about 20 actuators across four mold versions, redesigned how the actuators mount and seal, and built a Python-controlled pressure and motion setup for testing.

The main challenge has been making the hardware consistent enough to compare designs fairly. Each round of prototyping exposed the next problem: difficult molding, then leakage under load, then delamination of the strain-limiting layer.
"""

[[sections]]
type = "split"
id = "parametric-molds"
title = "Improving the molds"
image_side = "right"
media_layout = "grid"
body = """
These actuators are cast with a two-stage molding process based on the half-round actuator design from the Soft Robotics Toolkit. The molds I inherited had several issues: they relied on a shared length of steel stock and external clamps, which limited how many could be cast at once. They also left both actuator ends open, often trapped bubbles, and weren't clearly labeled.

I redesigned the molds from scratch over four or more versions. The new molds hold together with built-in bolts instead of external clamps, close both actuator ends, trap fewer bubbles, and can be cast several at a time.
"""

  [[sections.images]]
  src = "assets/images/actuator/actuatorMold.png"
  alt = "Assembled actuator mold with bolted end plates"
  caption = "Redesigned mold assembly."
  fit = "contain"

  [[sections.images]]
  src = "assets/images/actuator/actuatorMold1.png"
  alt = "Exploded CAD view of the actuator mold and its internal pieces"
  fit = "contain"
[[sections]]
type = "text"
body = """
The CAD is fully parametric, with actuator length, fiber angle, inner wall thickness, and other dimensions as variables. Each variant generates its own part number and calculates the silicone it needs, so I can mix and pour by weight.
"""

