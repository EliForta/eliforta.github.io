[[sections]]
type = "split"
id = "first-mount"
title = "Version 1"
image_side = "right"
media_layout = "stack"
body = "My first mount used barbed fittings. When the pressurized actuator met resistance, its flat underside pulled away from the fitting and released air. The connection needed to hold the half-round profile closed under load. 

Despite the leaking issue, the actuator showed promising performance in early testing, so I continued to work on the design by redesigning the actuator mounts."

  [[sections.images]]
  src = "assets/images/actuator/actuator3.png"
  alt = "First actuator mount with two angled barbed fittings"
  caption = "The original barbed connection."
  fit = "contain"

  [[sections.images]]
  src = "assets/images/actuator/actuator.mp4"
