  caption = "Despite the leaking, early testing showed promising results."

[[sections]]
type = "split"
id = "compression-seal"
title = "Version 2"
width = "full"
body = "I modified the molds to add a flange to the actuator end. Then I designed a new mount that clamps the flange between two parts. This creates a self-contained actuator module: the seal stays assembled when the module moves to a different fixture. The section view shows how the flange is held in place."

  [[sections.images]]
  src = "assets/images/actuator/actuator2.jpg"
  scale=0.5
  caption = "New actuator with an added flange"

