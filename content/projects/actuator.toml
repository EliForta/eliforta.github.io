[[sections]]
type = "split"
id = "sealing-result"
title = ""
image_side = "right"
media_layout = "grid"
# 30 psi is the reported prototype observation, not a rated operating pressure.
body = "After several iterations, the mount held 30 psi with no leakage observed in bench testing. That solved the seal but exposed a new failure: the strain-limiting layer began to separate from the actuator, causing twisting and inconsistent bending across repeated runs. With the seal reliable, the remaining problem was the actuator itself."

