id = "first-mount"
title = "Mount v1 - barbed fittings"
image_side = "right"
media_layout = "stack"
body = "My first mount used barbed fittings. When a pressurized actuator pressed against resistance, its flat underside pulled away from the fitting and leaked air. The connection needed to stay sealed under load. The actuators still performed well in early tests, so I kept the actuator design and redesigned the mount."

  [[sections.images]]
