[[sections]]
type = "split"
id = "sealing-result"
title = ""
image_side = "right"
media_layout = "grid"
# 30 psi is the reported prototype observation, not a rated operating pressure.
body = "After several iterations, the mount operated without observed leakage at 30 psi. That exposed a different failure: the strain-limiting layer began to separate, causing twisting and inconsistent bending across repeated runs. Fixing the seal made it possible to focus on the actuator material itself."

  [[sections.images]]
  src = "assets/images/actuator/actuator7.jpg"
  alt = "Fabricated silicone actuator held in an orange compression mount"
  caption = "Self-contained actuator module."
  fit = "contain"

