id = "modular-fixture"
title = "A modular system"
width = "reading"
body = "The sealed modules attach to a separate angled fixture. To compare mounting angles, I can change that fixture without rebuilding the actuator connection. The CAD assembly and physical setup show how the same module fits into the larger test system."

