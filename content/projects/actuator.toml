[[sections]]
type = "split"
id = "next-tests"
title = "Automated test setup"
body = """
The inherited setup used manual valves to fill and release pressure, and up/down buttons to move the gantry. I replaced both with Python control. Scripts set pressure setpoints and programmable pressure ramps, release and exhaust pressure, and control gantry position and speed. The hardware is a Parker P32P series electronic pressure regulator, two Chroma 62010L power supplies, and an MTS Criterion Model 41 controlled through MTS TestSuite.

This new setup makes it possible to fairly compare actuator designs, materials, and battery types.
"""

  [[sections.images]]
  src = "assets/images/actuator/code.png"
  alt = "Front CAD view of a three-actuator fixture concept"
  caption = "Example script to control gantry motion and pressure."
  fit = "contain"
  surface = "elevated"

[[sections]]
type = "text"
title = "Current Work"
width = "full"
body = """
The first priority is solving the delamination. I’m about to test a different material that looks promising. Once the actuators bend consistently, I’ll move on to full testing. The goal is to see how the design performs across different battery sizes, numbers of fingers, actuator lengths, and other variables. The modular fixtures make it easy to change the number of fingers, and the automated setup means each configuration can be compared under the same conditions.
"""
